<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
  <meta name="robots" content="noindex" />
  <title>404 — Peem Phetpimol</title>

  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .nf { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .nf__code { font-size: clamp(4.5rem, 20vw, 9rem); font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -.04em; }
    .nf__title { font-size: clamp(1.3rem, 4vw, 1.8rem); margin-top: 8px; }
    .nf__msg { color: var(--text-soft); font-size: 1.05rem; margin: 14px 0 30px; max-width: 42ch; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf__code">404</p>
      <h1 class="nf__title" data-en="Page not found" data-th="ไม่พบหน้านี้">Page not found</h1>
      <p class="nf__msg"
         data-en="The page you're looking for doesn't exist or has moved."
         data-th="หน้าที่คุณกำลังหาไม่มีอยู่ หรือถูกย้ายไปแล้ว">
        The page you're looking for doesn't exist or has moved.
      </p>
      <a class="btn btn--primary" href="/" data-en="Back to home" data-th="กลับหน้าแรก">Back to home</a>
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
